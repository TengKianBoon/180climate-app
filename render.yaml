services:
  - type: web
    name: 180climate-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Overlay B — PIPPIB moratorium map snapshot (deploy-time, see docs/deploy-runbook.md §1)
      - key: PIPPIB_SNAPSHOT_PATH
        sync: false
      # Email delivery — Hostinger SMTP (see docs/deploy-runbook.md §2)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LEAD_RECIPIENT_EMAIL
        sync: false
      # Google Sheets — lead backup (see docs/deploy-runbook.md §3)
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      # Owned intake registry — remains off until a private persistent database,
      # retention choice, geometry choice and operator owner are approved.
      - key: INTAKE_RECORDING_MODE
        value: off
      - key: INTAKE_DB_PATH
        sync: false
      - key: INTAKE_RETENTION_DAYS
        sync: false
      - key: INTAKE_STORE_GEOMETRY
        sync: false
      - key: INTAKE_OPERATOR_TOKEN
        sync: false
      - key: INTAKE_CONTROLLER_NAME
        sync: false
      - key: INTAKE_PRIVACY_CONTACT
        sync: false
      - key: INTAKE_HOSTING_REGION
        sync: false
      - key: INTAKE_RETENTION_VERSION
        sync: false
      - key: INTAKE_PROCESSOR_LIST_VERSION
        sync: false
      - key: INTAKE_OPERATOR_OWNER
        sync: false
      - key: INTAKE_AUTHORISED_DEPLOYER
        sync: false
      - key: INTAKE_BAHASA_PACK_VERSION
        sync: false
      - key: INTAKE_COUNSEL_APPROVAL_ID
        sync: false
      - key: INTAKE_LEGAL_REVIEW_STATUS
        sync: false
      - key: INTAKE_LEGAL_REVIEW_RECORD
        sync: false
      - key: INTAKE_COMPANY_APPROVAL_ID
        sync: false
      # Anthropic API — free-text classifier, optional (see docs/deploy-runbook.md §4)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Paid professional-service checkout — stays off until the separate live gate.
      - key: COMMERCIAL_CHECKOUT_MODE
        value: off
      - key: STRIPE_EUDR_REVIEW_PAYMENT_LINK
        sync: false
      - key: STRIPE_CARBON_REVIEW_PAYMENT_LINK
        sync: false
      - key: STRIPE_LAND_EVIDENCE_PILOT_PAYMENT_LINK
        sync: false
      - key: COMMERCIAL_LIVE_APPROVAL_ID
        sync: false
      - key: COMMERCIAL_TERMS_VERSION
        sync: false
      - key: COMMERCIAL_REFUND_POLICY_VERSION
        sync: false
      - key: COMMERCIAL_TAX_DISPLAY
        sync: false
