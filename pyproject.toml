[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"
# Cross-platform basetemp: relative path works on both Windows and Linux CI
addopts = "--basetemp=.pytest_tmp"
markers = [
    "network: live network test — skipped in CI (set CI=true to skip)",
]
