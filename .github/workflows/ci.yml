name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pydantic mypy pytest shapely pyproj fastapi uvicorn python-multipart httpx

      - name: Type-check contracts
        run: mypy core/contracts/__init__.py --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v
